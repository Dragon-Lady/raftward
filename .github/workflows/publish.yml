name: Publish to PyPI

# Configure PyPI pending Trusted Publisher before publishing a GitHub Release:
# project raftward; owner Dragon-Lady; repository raftward;
# workflow publish.yml; environment pypi.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag and test
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = f"v{metadata['project']['version']}"
          if os.environ["GITHUB_REF_NAME"] != expected:
              raise SystemExit(f"release tag must be {expected}")
          PY
          python -m pip install . pytest==8.4.2 build==1.6.1
          python -m pytest -q
          python -m compileall -q raftward tests
      - name: Build sdist and wheel
        run: python -m build
      - name: Inspect distribution set
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          actual = sorted(p.name for p in Path("dist").iterdir())
          expected = sorted([f"raftward-{version}-py3-none-any.whl", f"raftward-{version}.tar.gz"])
          if actual != expected:
              raise SystemExit(f"unexpected distribution set: {actual!r}")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
