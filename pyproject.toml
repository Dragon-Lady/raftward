[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raftward"
version = "0.1.3"
description = "Offline, guarded integrity checks for closed SQLite databases and backups"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["tomli>=2; python_version < '3.11'"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Topic :: Security"]

[project.scripts]
raftward = "raftward.cli:main"

[project.urls]
Homepage = "https://github.com/Dragon-Lady/raftward"
Issues = "https://github.com/Dragon-Lady/raftward/issues"
Funding = "https://github.com/sponsors/Dragon-Lady"
Changelog = "https://github.com/Dragon-Lady/raftward/releases"

[tool.setuptools.packages.find]
include = ["raftward*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
